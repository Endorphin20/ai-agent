[project]
name = "ai-agent"
version = "0.1.0"
description = "An ai-agent project rebuilt with the latest official LangChain and LangGraph patterns."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "elasticsearch>=8.15.0",
  "langchain>=0.3.27",
  "langchain-openai>=0.3.30",
  "langchain-text-splitters>=0.3.8",
  "langgraph>=0.6.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "reportlab>=4.2.2",
  "requests>=2.32.3",
  "sse-starlette>=2.1.3",
  "uvicorn>=0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2",
  "pytest>=8.3.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_agent*"]
